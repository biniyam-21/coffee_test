# ==============================================================
# Coffee Shop Order Management System (Akufada)
# Nginx Gateway Virtual Host & Reverse Proxy Configuration
# ==============================================================

upstream backend_cluster {
    # Round-robin load distribution with active failure detection
    server api-node-1:3001 max_fails=3 fail_timeout=10s;
    server api-node-2:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream web_cluster {
    server web-client:80;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    # Maximum client payload limit (10MB)
    client_max_body_size 10M;

    # Timeouts for backend connection and read
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    # Global Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Gateway Health Check Endpoint
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","gateway":"akufada_nginx","timestamp":"$time_iso8601"}';
    }

    # 2. Rate-limited Authentication API
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass_header X-Backend-Instance;
        proxy_pass_header X-Correlation-ID;
    }

    # 3. Core REST API (Load balanced between api-node-1 & api-node-2)
    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass_header X-Backend-Instance;
        proxy_pass_header X-Correlation-ID;

        # Automatic failover to healthy replica on transient connection error
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }

    # 4. OpenAPI / Swagger Documentation
    location /api/v1/docs {
        proxy_pass http://backend_cluster/api/v1/docs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 5. Web Frontend Static SPA Bundle
    location / {
        proxy_pass http://web_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
